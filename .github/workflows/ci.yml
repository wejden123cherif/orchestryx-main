name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall apps workers scripts tests alembic

      - name: Validate Alembic revision graph
        if: ${{ hashFiles('alembic/versions/*.py') != '' }}
        run: alembic heads --resolve-dependencies

      - name: Run backend tests
        if: ${{ hashFiles('tests/**/*.py') != '' }}
        run: python -m pytest tests/ -v

      - name: Skip backend tests
        if: ${{ hashFiles('tests/**/*.py') == '' }}
        run: echo "No Python tests found under tests/."

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/web

    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No frontend lint script defined."
          fi

      - name: Run frontend typecheck
        run: |
          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            npm run typecheck
          else
            echo "No frontend typecheck script defined."
          fi

      - name: Build frontend
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "No frontend build script defined."
          fi

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Build API image
        run: docker build -f Dockerfile -t orchestryx-api:ci .

      - name: Build worker image
        run: docker build -f Dockerfile.worker -t orchestryx-worker:ci .

  cdk:
    name: CDK synth
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CDK_DEFAULT_ACCOUNT: '000000000000'
      CDK_DEFAULT_REGION: eu-central-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: infra/platform_cdk/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CDK Python dependencies
        run: python -m pip install -r infra/platform_cdk/requirements.txt

      - name: Install AWS CDK CLI
        run: npm install --global aws-cdk@2.180.0

      - name: Synthesize dev infrastructure
        run: cdk synth -c env=dev
        working-directory: infra/platform_cdk
