# Alembic configuration for Orchestryx.
# Run migrations with:
#   alembic upgrade head
# Generate a new revision with:
#   alembic revision --autogenerate -m "description"

[alembic]
# Path to the migration scripts directory.
script_location = alembic

# Template used to generate migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for the file_template timestamp.
timezone = UTC

# Maximum length of the slug portion of the filename.
truncate_slug_length = 40

# sys.path prepend — leave empty for the project root.
prepend_sys_path = .

# Version path separator — use os (default) or : or ;
version_path_separator = os

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
